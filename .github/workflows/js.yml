name: JS CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'js/**'
      - 'scripts/**'
      - '.github/workflows/js.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'js/**'
      - 'scripts/**'
      - '.github/workflows/js.yml'
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Manual release mode'
        required: true
        type: choice
        default: 'instant'
        options:
          - instant
          - changeset-pr
      bump_type:
        description: 'Manual release type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      description:
        description: 'Manual release description (optional)'
        required: false
        type: string

# Least privilege by default; jobs that need to write escalate individually.
permissions:
  contents: read

concurrency:
  group: js-${{ github.workflow }}-${{ github.ref }}
  # A release runs on push to main. Cancelling it mid-publish would leave a
  # version bumped and tagged but not published, so main runs always finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Changeset check - only runs on PRs
  changeset-check:
    name: Check for Changesets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: js

      - name: Check for changesets
        # HEAD_REF is a branch name chosen by the PR author. Interpolating it
        # into the script would let a branch name execute shell code.
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Skip changeset check for automated version PRs
          if [[ "$HEAD_REF" == "changeset-release/"* ]]; then
            echo "Skipping changeset check for automated release PR"
            exit 0
          fi

          # Run changeset validation script
          node scripts/validate-changeset.mjs

  # Linting and formatting - runs after changeset check on PRs, immediately on main
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changeset-check]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changeset-check.result == 'success') }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: js

      - name: Run ESLint
        run: npm run lint
        working-directory: js

      - name: Check formatting
        run: npm run format:check
        working-directory: js

      - name: Check file size limit
        run: npm run check:file-size
        working-directory: js

  # Test with Bun (this project is Bun-only)
  # Only runs unit tests (no external dependencies/API calls)
  # Integration/e2e tests are in integration-tests.yml and model-tests.yml (manual execution)
  test:
    name: Unit Tests (Bun on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [changeset-check]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changeset-check.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Need to checkout the PR branch for push access
          ref: ${{ github.head_ref || github.ref }}
          # Use a token with write access for pushing cache commits
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: js

      # Use the package script so CI and local runs execute the same suite.
      # A hardcoded four-file list silently skipped 48 of the 52 unit test
      # files, making CI green while regressions went unnoticed (issue #287).
      - name: Run unit tests
        run: bun run test
        working-directory: js

      - name: Commit cached API responses
        # Only commit on the primary OS to avoid conflicts
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        run: |
          # Check if there are any new cached files in data/api-cache
          if [ -d "data/api-cache" ] && [ -n "$(git status --porcelain data/api-cache/)" ]; then
            echo "Found uncommitted cached API responses"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/api-cache/
            git commit -m "chore: commit cached API responses (Links Notation format)

            🤖 Generated with [Claude Code](https://claude.com/claude-code)

            Co-Authored-By: Claude <noreply@anthropic.com>"
            git push
            echo "Pushed cached API responses to branch"
          else
            echo "No new cached API responses to commit"
          fi

  # Verbose HTTP logging integration test - verifies --verbose mode logs HTTP traffic
  # This is the ONLY real-API test in CI/CD. Uses free-tier model (opencode/minimax-m2.5-free)
  # to verify HTTP request/response logging works end-to-end.
  # Runs only on ubuntu-latest to conserve free API limits.
  # See: https://github.com/link-assistant/agent/issues/221
  verbose-integration:
    name: Verbose HTTP Logging Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changeset-check]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changeset-check.result == 'success') }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: js

      - name: Run verbose HTTP logging integration test
        run: bun test ./tests/integration/verbose-hi.js
        working-directory: js
        timeout-minutes: 5

  # Verify the published dependency graph installs without peer warnings.
  package-install:
    name: Clean Package Install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changeset-check]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changeset-check.result == 'success') }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Pack package
        id: pack
        working-directory: js
        run: |
          TARBALL=$(bun pm pack --quiet | tail -1)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Install package in a clean project
        env:
          TARBALL: ${{ github.workspace }}/js/${{ steps.pack.outputs.tarball }}
        run: |
          CONSUMER_DIR=$(mktemp -d)
          cd "$CONSUMER_DIR"
          bun init -y
          bun add "$TARBALL" 2>&1 | tee install.log
          if grep -q 'warn: incorrect peer dependency' install.log; then
            echo "::error::Packed package installation emitted an incorrect peer dependency warning"
            exit 1
          fi

  # Release - only runs on main after tests pass (for push events)
  release:
    name: Release
    needs: [lint, test, verbose-integration, package-install]
    # Use always() to ensure this job runs even if changeset-check was skipped
    # This is needed because lint/test jobs have a transitive dependency on changeset-check
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.lint.result == 'success' && needs.test.result == 'success' && needs.verbose-integration.result == 'success' && needs.package-install.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-main
      cancel-in-progress: false
    # Permissions required for npm OIDC trusted publishing
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: js

      - name: Update npm for OIDC trusted publishing
        run: node scripts/setup-npm.mjs

      - name: Check for changesets
        id: check_changesets
        run: |
          # Count changeset files (excluding README.md and config.json)
          CHANGESET_COUNT=$(find js/.changeset -name "*.md" ! -name "README.md" | wc -l)
          echo "Found $CHANGESET_COUNT changeset file(s)"
          echo "has_changesets=$([[ $CHANGESET_COUNT -gt 0 ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Version packages and commit to main
        if: steps.check_changesets.outputs.has_changesets == 'true'
        id: version
        run: node scripts/version-and-commit.mjs --mode changeset

      - name: Publish to npm
        # Run if version was committed OR if a previous attempt already committed (for re-runs)
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        id: publish
        run: node scripts/publish-to-npm.mjs --should-pull

      - name: Create GitHub Release
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/create-github-release.mjs --release-version "${{ steps.publish.outputs.published_version }}" --repository "${{ github.repository }}" --prefix "js-"

      - name: Format GitHub release notes
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/format-github-release.mjs --release-version "${{ steps.publish.outputs.published_version }}" --repository "${{ github.repository }}" --commit-sha "${{ github.sha }}" --prefix "js-"

  # Manual Instant Release - triggered via workflow_dispatch with instant mode
  # This job is in js.yml because npm trusted publishing
  # only allows one workflow file to be registered as a trusted publisher
  instant-release:
    name: Instant Release
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'instant'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-main
      cancel-in-progress: false
    # Permissions required for npm OIDC trusted publishing
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: js

      - name: Update npm for OIDC trusted publishing
        run: node scripts/setup-npm.mjs

      - name: Version packages and commit to main
        id: version
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          DESCRIPTION: ${{ github.event.inputs.description }}
        run: node scripts/version-and-commit.mjs --mode instant

      - name: Publish to npm
        # Run if version was committed OR if a previous attempt already committed (for re-runs)
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        id: publish
        run: node scripts/publish-to-npm.mjs

      - name: Create GitHub Release
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/create-github-release.mjs --release-version "${{ steps.publish.outputs.published_version }}" --repository "${{ github.repository }}" --prefix "js-"

      - name: Format GitHub release notes
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/format-github-release.mjs --release-version "${{ steps.publish.outputs.published_version }}" --repository "${{ github.repository }}" --commit-sha "${{ github.sha }}" --prefix "js-"

  # Manual Changeset PR - creates a pull request with the changeset for review
  changeset-pr:
    name: Create Changeset PR
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'changeset-pr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: js

      - name: Create changeset file
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          DESCRIPTION: ${{ github.event.inputs.description }}
        run: node scripts/create-manual-changeset.mjs

      - name: Format changeset with Prettier
        run: |
          # Run Prettier on the changeset file to ensure it matches project style
          cd js && npx prettier --write ".changeset/*.md" || true

          echo "Formatted changeset files"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: add changeset for manual ${{ github.event.inputs.bump_type }} release'
          branch: changeset-manual-release-${{ github.run_id }}
          delete-branch: true
          title: 'chore: manual ${{ github.event.inputs.bump_type }} release'
          body: |
            ## Manual Release Request

            This PR was created by a manual workflow trigger to prepare a **${{ github.event.inputs.bump_type }}** release.

            ### Release Details
            - **Type:** ${{ github.event.inputs.bump_type }}
            - **Description:** ${{ github.event.inputs.description || 'Manual release' }}
            - **Triggered by:** @${{ github.actor }}

            ### Next Steps
            1. Review the changeset in this PR
            2. Merge this PR to main
            3. The automated release workflow will create a version PR
            4. Merge the version PR to publish to npm and create a GitHub release
